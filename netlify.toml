# One site. https://mycroscope.co.za is the public website.
# /sign-in, /overview and the other app paths load the dashboard (app.html).
# Set EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY in the Netlify site environment.
# They are compiled into the dashboard at build time.
# The Netlify hostname redirects to the domain.
[build]
  command = "bash scripts/publish-web.sh"
  publish = "publish"

[build.environment]
  NODE_VERSION = "22"
  # The project address and the anon key are compiled into the public dashboard.
  # Netlify still scans every other environment value.
  SECRETS_SCAN_OMIT_KEYS = "EXPO_PUBLIC_SUPABASE_URL,EXPO_PUBLIC_SUPABASE_ANON_KEY"

# The old hostname sends people to the domain, including the path they asked for.
[[redirects]]
  from = "/*"
  to = "https://mycroscope.co.za/:splat"
  status = 301
  force = true

  [redirects.conditions]
    Host = ["mycroscope.netlify.app"]

