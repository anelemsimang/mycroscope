<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment sent | Mycroscope</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="/"><img src="/brand/mycroscope-horizontal-lens-color.svg" alt="Mycroscope" width="1280" height="228"></a>
      <nav class="nav" aria-label="Primary"><a href="/pricing">Pricing</a></nav>
    </div>
  </header>
  <main id="main" class="section">
    <div class="wrap order">
      <p class="kicker">Payment</p>
      <h1>Payment sent.</h1>
      <p id="payment-status">Checking this payment with Yoco.</p>
      <p><button class="button" id="receipt" type="button" hidden>Download receipt</button></p>
      <p id="receipt-note" hidden>The receipt is also kept on the billing page.</p>
      <p><a class="button" href="/billing">Check billing</a></p>
      <p><a id="again" href="/pricing">Back to pricing</a></p>
    </div>
  </main>
  <footer><div class="wrap legal"><a href="/">Home</a> · <a href="/terms">Terms</a> · <a href="/privacy">Privacy</a></div></footer>
  <script src="js/billing-config.js"></script>
  <script type="module" src="js/checkout-received.js"></script>
  <script>
    const plan = new URLSearchParams(location.search).get('plan');
    if (plan && /^(work_activity|workforce|productivity)$/.test(plan)) {
      document.querySelector('#again').href = '/checkout?plan=' + plan;
      document.querySelector('#again').textContent = 'Get this plan again';
    }
  </script>
</body>
</html>
