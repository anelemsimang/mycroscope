worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
daemon off;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  charset utf-8;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/css text/plain text/xml application/xml application/javascript text/javascript application/json image/svg+xml;
  keepalive_timeout 30s;
  client_max_body_size 32k;
  limit_req_zone $binary_remote_addr zone=support:1m rate=5r/m;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'unsafe-inline'; upgrade-insecure-requests" always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      add_header Cache-Control "no-store" always;
      return 200 "ok\n";
    }

    location = /support {
      limit_req zone=support burst=2 nodelay;
      limit_except POST { deny all; }
      client_max_body_size 32k;
      resolver 127.0.0.11 valid=30s ipv6=off;
      set $inbox_upstream inbox:8080;
      proxy_pass http://$inbox_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 10s;
    }

    location /downloads/ {
      add_header Content-Disposition "attachment" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Permitted-Cross-Domain-Policies "none" always;
      add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
      add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'unsafe-inline'; upgrade-insecure-requests" always;
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ $uri/index.html =404;
    }
  }
}
